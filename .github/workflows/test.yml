name: test

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # package.json's test script uses --experimental-test-isolation, a Node 22 flag;
          # the Dockerfile ships node:22 too.
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
